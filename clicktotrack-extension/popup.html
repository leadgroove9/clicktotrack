<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
    }
    .title { font-weight: 700; font-size: 15px; }
    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #6366f1; }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: #6366f1; color: white; }
    .btn-active { background: #ef4444; color: white; }
    .goals-section {
      margin-top: 16px;
      border-top: 1px solid #1e293b;
      padding-top: 12px;
    }
    .goal-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎯</div>
    <div>
      <div class="title">ClicktoTrack</div>
      <div style="font-size: 10px; color: #94a3b8;">Goal Selector v1.0</div>
    </div>
  </div>

  <div class="form-group">
    <label>Workspace Site ID</label>
    <input type="text" id="site-id-input" value="demo-site-123" placeholder="e.g. demo-site-123">
  </div>

  <button id="toggle-inspector-btn" class="btn btn-primary">
    <span>🎯 Start Point & Click Selector</span>
  </button>

  <div class="goals-section">
    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
      <label style="margin:0;">Active Goals</label>
      <span id="goals-count" style="font-size: 10px; color: #6366f1; font-weight: 600;">0 configured</span>
    </div>
    <div id="goals-container"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
