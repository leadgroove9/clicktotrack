<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .title { font-weight: 700; font-size: 14px; color: #fff; }
    .badge { background: #334155; color: #94a3b8; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; }
    input[type="text"], textarea {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-primary:hover { background: #4338ca; }
    .btn-ai { background: #059669; color: #fff; }
    .btn-ai:hover { background: #047857; }
    .btn-active { background: #dc2626; color: #fff; }
    .divider { border-top: 1px solid #334155; margin: 14px 0; }
    .goals-title { font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .goal-item { background: #1e293b; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
    .goal-name { font-weight: 600; color: #e2e8f0; }
    .goal-category { color: #64748b; font-size: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">⚡ ClicktoTrack</span>
    <span class="badge">v1.0.0</span>
  </div>

  <div class="field">
    <label>Workspace Site ID</label>
    <input type="text" id="site-id-input" placeholder="e.g. acmeplumbing-com-workspace">
  </div>

  <div class="field">
    <label>Mode 1: Visual Selector</label>
    <button id="toggle-inspector-btn" class="btn-primary">🎯 Start Point & Click Selector</button>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label>Mode 2: AI Natural Language Prompt</label>
    <textarea id="ai-prompt-input" rows="2" placeholder="e.g. Track clicks on emergency plumber button"></textarea>
    <button id="ai-submit-btn" class="btn-ai" style="margin-top: 6px;">🤖 Find & Set Up Goal with AI</button>
  </div>

  <div class="divider"></div>

  <div class="goals-title">
    <span>Active Conversion Goals</span>
    <span id="goals-count">0 configured</span>
  </div>
  <div id="goals-container"></div>

  <script src="popup.js"></script>
</body>
</html>
